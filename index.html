<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dungeon Game</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #050505;
            color: #ffffff;
            font-family: monospace, sans-serif;
            overflow: hidden;
        }

        /* 피격 시 화면 테두리 경고 */
        #damage-vignette {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            box-shadow: inset 0 0 80px rgba(239, 68, 68, 0);
            z-index: 99;
            transition: box-shadow 0.05s ease-out;
        }

        /* UI 상단 바 */
        #ui-bar {
            width: 320px;
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        #hp-container {
            width: 100%;
            height: 14px;
            background-color: #2a0808;
            border: 2px solid #5a1010;
            border-radius: 4px;
            overflow: hidden;
        }

        #hp-bar {
            width: 100%;
            height: 100%;
            background-color: #dc2626;
            transition: width 0.15s ease;
        }

        #status-info {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 13px;
            font-weight: bold;
            color: #d1d5db;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 완전한 2D 코인 */
        .icon-coin {
            width: 12px; height: 12px;
            background-color: #fbbf24;
            border: 2px solid #d97706;
            border-radius: 50%;
            box-shadow: none;
            display: inline-block;
            position: relative;
        }
        .icon-coin::after {
            content: ''; position: absolute; top: 2px; left: 2px;
            width: 4px; height: 4px; background-color: #fef08a;
            border-radius: 50%;
        }

        .icon-key {
            width: 12px; height: 12px;
            position: relative;
            display: inline-block;
        }

        .icon-key::before {
            content: ''; position: absolute; top: 0; left: 0;
            width: 5px; height: 5px;
            border: 1.5px solid #eab308; border-radius: 50%;
        }

        .icon-key::after {
            content: ''; position: absolute; top: 5px; left: 2px;
            width: 2px; height: 7px;
            background-color: #eab308;
            box-shadow: 2px 2px 0 #eab308;
        }

        .icon-potion {
            width: 10px; height: 12px;
            position: relative;
            display: inline-block;
        }

        .icon-potion::before {
            content: ''; position: absolute; top: 0; left: 3px;
            width: 4px; height: 3px; background-color: #94a3b8;
        }

        .icon-potion::after {
            content: ''; position: absolute; top: 3px; left: 0;
            width: 10px; height: 9px;
            background-color: #ef4444; border-radius: 2px;
            border: 1px solid #b91c1c;
        }

        /* 게임 메인 방 */
        #room-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
        }

        #room {
            width: 320px;
            height: 320px;
            background-color: #000000; /* 단색 검은색 바닥 */
            border: 4px solid #1a1a1a;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0,0,0,1);
        }

        /* 문 및 장애물 */
        .door {
            position: absolute;
            background-color: #525252;
            border: 1px solid #262626;
            z-index: 2;
        }

        .door-top { top: 0; left: 50%; transform: translateX(-50%); width: 44px; height: 8px; border-top: none; border-radius: 0 0 4px 4px; }
        .door-bottom { bottom: 0; left: 50%; transform: translateX(-50%); width: 44px; height: 8px; border-bottom: none; border-radius: 4px 4px 0 0; }
        .door-left { top: 50%; left: 0; transform: translateY(-50%); width: 8px; height: 44px; border-left: none; border-radius: 0 4px 4px 0; }
        .door-right { top: 50%; right: 0; transform: translateY(-50%); width: 8px; height: 44px; border-right: none; border-radius: 4px 0 0 4px; }

        .wall {
            position: absolute;
            background-color: #171717;
            border: 1px solid #333333;
            border-radius: 2px;
            z-index: 1;
        }

        /* 플레이어 */
        #player {
            width: 12px;
            height: 12px;
            background-color: #6366f1;
            border: 1px solid #818cf8;
            border-radius: 3px;
            position: absolute;
            top: 154px;
            left: 154px;
            box-shadow: 0 0 8px rgba(99, 102, 241, 0.8);
            transform-origin: center center;
            z-index: 10;
        }

        #dagger-pivot {
            position: absolute;
            top: 6px;
            left: 6px;
            width: 0; height: 0;
            transform-origin: 0 0;
        }

        .dagger {
            position: absolute;
            top: -2px; left: 5px;
            width: 12px; height: 3px;
            background: linear-gradient(90deg, #94a3b8, #ffffff);
            border-radius: 0 3px 3px 0;
            box-shadow: 0 0 4px rgba(255, 255, 255, 0.9);
        }

        /* 타격감 있는 베기 이펙트 */
        .slash { animation: slash-anim 0.15s cubic-bezier(0.1, 0.9, 0.2, 1); }
        @keyframes slash-anim {
            0% { transform: rotate(-90deg) scale(0.8); }
            50% { transform: rotate(90deg) scale(1.4); }
            100% { transform: rotate(0deg) scale(1); }
        }

        .slash-arc {
            position: absolute;
            top: -14px; left: 2px;
            width: 24px; height: 28px;
            border-right: 4px solid #ffffff;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.9;
            box-shadow: 0 0 8px #ffffff;
            animation: arc-fade 0.15s ease-out forwards;
        }
        @keyframes arc-fade {
            to { opacity: 0; transform: scale(1.3); }
        }

        /* 대시 선 잔상 이펙트 */
        .dash-line {
            position: absolute;
            height: 3px;
            background: linear-gradient(90deg, rgba(99, 102, 241, 0), rgba(255, 255, 255, 0.9), rgba(99, 102, 241, 0));
            transform-origin: left center;
            pointer-events: none;
            z-index: 9;
            box-shadow: 0 0 6px #818cf8;
            animation: dash-fade 0.22s ease-out forwards;
        }
        @keyframes dash-fade {
            to { opacity: 0; transform: scaleY(0.1); }
        }

        /* 적 (동그랗게 변경) */
        .enemy {
            width: 14px; height: 14px;
            background-color: #ef4444;
            border: 2px solid #f87171;
            border-radius: 50%; /* 완전히 동그랗게 */
            position: absolute;
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.7);
            z-index: 5;
        }

        .enemy-hp-base {
            position: absolute; top: -7px; left: -1px;
            width: 16px; height: 3px;
            background-color: #450a0a; border-radius: 1px;
        }

        .enemy-hp-fill {
            width: 100%; height: 100%;
            background-color: #ef4444; border-radius: 1px;
        }

        /* 락온 조준 마크 */
        #target-marker {
            position: absolute;
            width: 20px; height: 20px;
            border: 2px dashed #facc15;
            border-radius: 50%;
            pointer-events: none;
            z-index: 12;
            display: none;
            animation: spin 3s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* 적 투사체 */
        .projectile {
            position: absolute;
            width: 6px; height: 6px;
            background-color: #f87171;
            border-radius: 50%;
            box-shadow: 0 0 6px #ef4444;
            z-index: 6;
        }

        /* 마인크래프트 스타일 블록형 상자 */
        .chest {
            width: 16px; height: 16px;
            background-color: #78350f;
            border: 2px solid #451a03;
            border-radius: 2px;
            position: absolute; z-index: 4;
            box-shadow: inset 0 2px 0 #9a3412;
        }
        .chest::before {
            content: ''; position: absolute; top: 6px; left: 0; right: 0;
            height: 2px; background-color: #27272a;
        }
        .chest::after {
            content: ''; position: absolute; top: 5px; left: 6px;
            width: 4px; height: 4px; background-color: #eab308;
            border: 1px solid #854d0e;
        }
        .chest.gold {
            background-color: #ca8a04;
            border: 2px solid #713f12;
            box-shadow: inset 0 2px 0 #fde047;
        }

        /* 드롭 아이템 */
        .drop-item {
            position: absolute; z-index: 8;
            animation: drop-bounce 0.4s ease-out forwards;
        }
        .drop-item.disabled {
            opacity: 0.6;
            filter: grayscale(0.5);
        }
        @keyframes drop-bounce {
            0% { transform: translate(0, 0) scale(0.4); opacity: 0; }
            50% { transform: translate(var(--dx), var(--dy)) scale(1.2); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(1); opacity: 1; }
        }

        /* 먼지 파티클 이펙트 */
        .dust-particle {
            position: absolute;
            width: 4px; height: 4px;
            background-color: rgba(156, 163, 175, 0.5);
            border-radius: 50%;
            pointer-events: none;
            z-index: 3;
            animation: dust-fade 0.35s ease-out forwards;
        }
        @keyframes dust-fade {
            to { opacity: 0; transform: scale(2.2) translateY(-4px); }
        }

        /* 데미지 텍스트 */
        .dmg-text {
            position: absolute;
            font-size: 11px;
            font-weight: bold;
            color: #ffffff;
            pointer-events: none;
            z-index: 20;
            animation: float-up 0.6s ease-out forwards;
            text-shadow: 0 0 3px #000;
        }
        .dmg-text.crit {
            font-size: 14px;
            color: #ff7800;
            text-shadow: 0 0 6px #ff0000;
        }
        .dmg-text.player-taken {
            color: #f87171;
        }
        @keyframes float-up {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-18px) scale(1.1); }
        }

        /* 사망 파티클 */
        .particle {
            position: absolute;
            width: 4px; height: 4px;
            background-color: #ef4444;
            border-radius: 50%;
            pointer-events: none;
            z-index: 15;
            animation: particle-fade 0.4s ease-out forwards;
        }
        @keyframes particle-fade {
            to { opacity: 0; transform: translate(var(--px), var(--py)) scale(0); }
        }

        /* 컨트롤러 */
        #controls-container {
            width: 320px;
            height: 130px;
            margin-top: 15px;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #joystick-base {
            width: 110px; height: 110px;
            background-color: #171717;
            border: 3px solid #262626;
            border-radius: 50%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #joystick-stick {
            width: 45px; height: 45px;
            background-color: #333333;
            border: 2px solid #525252;
            border-radius: 50%;
            position: absolute;
        }

        #attack-btn {
            width: 85px; height: 85px;
            background-color: #991b1b;
            color: #fca5a5;
            border: 3px solid #dc2626;
            border-radius: 50%;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.6);
        }
        #attack-btn:active { background-color: #7f1d1d; }
    </style>
</head>
<body>

    <div id="damage-vignette"></div>

    <div id="ui-bar">
        <div id="hp-container">
            <div id="hp-bar"></div>
        </div>
        <div id="status-info">
            <div class="info-item">
                <span class="icon-coin"></span>
                <span id="coin-txt">000</span>
            </div>
            <div class="info-item">
                <span class="icon-key"></span>
                <span id="key-txt">000</span>
            </div>
        </div>
    </div>

    <div id="room-wrapper">
        <div id="room">
            <div class="door door-top"></div>
            <div class="door door-bottom"></div>
            <div class="door door-left"></div>
            <div class="door door-right"></div>

            <div id="target-marker"></div>

            <div id="player">
                <div id="dagger-pivot">
                    <div class="dagger"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="controls-container">
        <div id="joystick-base">
            <div id="joystick-stick"></div>
        </div>
        <button id="attack-btn">공격</button>
    </div>

    <script>
        const roomWrapper = document.getElementById('room-wrapper');
        const room = document.getElementById('room');
        const player = document.getElementById('player');
        const daggerPivot = document.getElementById('dagger-pivot');
        const targetMarker = document.getElementById('target-marker');
        const vignette = document.getElementById('damage-vignette');
        const base = document.getElementById('joystick-base');
        const stick = document.getElementById('joystick-stick');
        const attackBtn = document.getElementById('attack-btn');
        const hpBar = document.getElementById('hp-bar');
        const coinTxt = document.getElementById('coin-txt');
        const keyTxt = document.getElementById('key-txt');

        // 게임 변수
        let playerX = 154, playerY = 154;
        let moveX = 0, moveY = 0;
        let playerAngle = 0;
        let dustTimer = 0;

        let maxHp = 100, currentHp = 100;
        let coins = 0, keys = 0;
        let distanceFromStart = 0;

        let enemies = [];
        let projectiles = [];
        let chests = [];
        let drops = [];
        let walls = [];
        let lockedEnemy = null;
        let initialEnemyCount = 0;

        let joystickPointerId = null;

        const roomTemplates = [
            [],
            [{x: 80, y: 80, w: 40, h: 40}, {x: 200, y: 80, w: 40, h: 40}, {x: 80, y: 200, w: 40, h: 40}, {x: 200, y: 200, w: 40, h: 40}],
            [{x: 120, y: 120, w: 80, h: 80}],
            [{x: 140, y: 60, w: 40, h: 60}, {x: 140, y: 200, w: 40, h: 60}, {x: 60, y: 140, w: 60, h: 40}, {x: 200, y: 140, w: 60, h: 40}],
            [{x: 30, y: 30, w: 50, h: 50}, {x: 240, y: 30, w: 50, h: 50}, {x: 30, y: 240, w: 50, h: 50}, {x: 240, y: 240, w: 50, h: 50}]
        ];

        // 데미지 계산 (40% 크리티컬)
        function calcDamage(baseDmg) {
            const isCrit = Math.random() < 0.40;
            return { damage: isCrit ? baseDmg * 1.5 : baseDmg, isCrit };
        }

        function showDmgText(x, y, amount, isCrit, isPlayerTaken = false) {
            const el = document.createElement('div');
            el.className = `dmg-text ${isCrit ? 'crit' : ''} ${isPlayerTaken ? 'player-taken' : ''}`;
            el.innerText = (isCrit ? 'CRIT ' : '') + Math.round(amount);
            el.style.left = (x - 10) + 'px';
            el.style.top = (y - 12) + 'px';
            room.appendChild(el);
            setTimeout(() => el.remove(), 600);
        }

        function triggerShake(intensity = 6) {
            let count = 0;
            const interval = setInterval(() => {
                const rx = (Math.random() - 0.5) * intensity;
                const ry = (Math.random() - 0.5) * intensity;
                roomWrapper.style.transform = `translate(${rx}px, ${ry}px)`;
                count++;
                if (count > 5) {
                    clearInterval(interval);
                    roomWrapper.style.transform = 'translate(0,0)';
                }
            }, 25);
        }

        function triggerRedVignette() {
            vignette.style.boxShadow = 'inset 0 0 80px rgba(239, 68, 68, 0.8)';
            setTimeout(() => {
                vignette.style.boxShadow = 'inset 0 0 80px rgba(239, 68, 68, 0)';
            }, 150);
        }

        function spawnDeathParticles(x, y) {
            for (let i = 0; i < 12; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 25 + 10;
                p.style.setProperty('--px', Math.cos(angle) * dist + 'px');
                p.style.setProperty('--py', Math.sin(angle) * dist + 'px');
                p.style.left = x + 'px'; p.style.top = y + 'px';
                room.appendChild(p);
                setTimeout(() => p.remove(), 400);
            }
        }

        // 대시 선 잔상 생성
        function createDashTrail(x1, y1, x2, y2) {
            const line = document.createElement('div');
            line.className = 'dash-line';
            const length = Math.hypot(x2 - x1, y2 - y1);
            const angle = Math.atan2(y2 - y1, x2 - x1) * (180 / Math.PI);
            
            line.style.width = length + 'px';
            line.style.left = (x1 + 6) + 'px';
            line.style.top = (y1 + 6) + 'px';
            line.style.transform = `rotate(${angle}deg)`;
            
            room.appendChild(line);
            setTimeout(() => line.remove(), 220);
        }

        // 먼지 이펙트 생성
        function spawnDust(x, y) {
            const dust = document.createElement('div');
            dust.className = 'dust-particle';
            dust.style.left = (x + Math.random() * 6 - 3) + 'px';
            dust.style.top = (y + 10) + 'px';
            room.appendChild(dust);
            setTimeout(() => dust.remove(), 350);
        }

        // 방 초기화
        function loadRoom(doorType) {
            enemies.forEach(e => e.el.remove());
            projectiles.forEach(p => p.el.remove());
            chests.forEach(c => c.el.remove());
            drops.forEach(d => d.el.remove());
            walls.forEach(w => w.el.remove());

            enemies = []; projectiles = []; chests = []; drops = []; walls = [];
            lockedEnemy = null;

            if (doorType !== 'center') distanceFromStart++;

            if (doorType === 'top') playerY = 280;
            else if (doorType === 'bottom') playerY = 30;
            else if (doorType === 'left') playerX = 280;
            else if (doorType === 'right') playerX = 30;

            const templateIdx = Math.floor(Math.random() * roomTemplates.length);
            roomTemplates[templateIdx].forEach(w => {
                const wallEl = document.createElement('div');
                wallEl.className = 'wall';
                wallEl.style.left = w.x + 'px'; wallEl.style.top = w.y + 'px';
                wallEl.style.width = w.w + 'px'; wallEl.style.height = w.h + 'px';
                room.appendChild(wallEl);
                walls.push({ x: w.x, y: w.y, w: w.w, h: w.h, el: wallEl });
            });

            if (distanceFromStart > 0) {
                const hasEnemies = Math.random() > 0.25;
                if (hasEnemies) {
                    const minE = Math.min(2 + Math.floor(distanceFromStart * 0.8), 10);
                    const maxE = Math.min(4 + Math.floor(distanceFromStart * 1.5), 20);
                    const count = Math.floor(Math.random() * (maxE - minE + 1)) + minE;
                    for (let i = 0; i < count; i++) spawnEnemy();
                    initialEnemyCount = count;
                } else {
                    initialEnemyCount = 0;
                    const chestCount = Math.floor(Math.random() * 4) + 1;
                    for (let i = 0; i < chestCount; i++) spawnChest(Math.random() < 0.2);
                }
            } else {
                initialEnemyCount = 0;
            }
        }

        function spawnEnemy() {
            let x, y, collides;
            do {
                collides = false;
                x = Math.random() * 240 + 40;
                y = Math.random() * 240 + 40;
                for (let w of walls) {
                    if (x < w.x + w.w && x + 14 > w.x && y < w.y + w.h && y + 14 > w.y) { collides = true; break; }
                }
            } while (collides);

            const el = document.createElement('div');
            el.className = 'enemy';
            el.style.left = x + 'px'; el.style.top = y + 'px';

            const hpBase = document.createElement('div');
            hpBase.className = 'enemy-hp-base';
            const hpFill = document.createElement('div');
            hpFill.className = 'enemy-hp-fill';
            hpBase.appendChild(hpFill);
            el.appendChild(hpBase);

            room.appendChild(el);
            enemies.push({ x, y, maxHp: 20, hp: 20, el, hpFill, lastShoot: Date.now() + Math.random()*1000 });
        }

        function spawnChest(isGold) {
            let x, y, collides;
            do {
                collides = false;
                x = Math.random() * 240 + 40;
                y = Math.random() * 240 + 40;
                for (let w of walls) {
                    if (x < w.x + w.w && x + 16 > w.x && y < w.y + w.h && y + 16 > w.y) { collides = true; break; }
                }
            } while (collides);

            const el = document.createElement('div');
            el.className = isGold ? 'chest gold' : 'chest';
            el.style.left = x + 'px'; el.style.top = y + 'px';
            room.appendChild(el);
            chests.push({ x, y, isGold, el });
        }

        function openChest(c, index) {
            if (c.isGold) {
                if (keys < 1) return;
                keys--;
                updateUI();
                spawnDrop('coin', Math.floor(Math.random() * 10) + 5, c.x, c.y);
                spawnDrop('potion', 1, c.x, c.y);
            } else {
                spawnDrop('coin', Math.floor(Math.random() * 3) + 1, c.x, c.y);
                if (Math.random() < 0.2) spawnDrop('key', 1, c.x, c.y);
            }
            c.el.remove();
            chests.splice(index, 1);
        }

        // 아이템 0.5초 대기 후 획득 가능하도록 설정
        function spawnDrop(type, amount, x, y) {
            const el = document.createElement('div');
            el.className = 'drop-item disabled ' + (type === 'coin' ? 'icon-coin' : type === 'key' ? 'icon-key' : 'icon-potion');
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.random() * 25 + 12;
            const dx = Math.cos(angle) * dist + 'px';
            const dy = Math.sin(angle) * dist + 'px';
            el.style.setProperty('--dx', dx); el.style.setProperty('--dy', dy);
            el.style.left = x + 'px'; el.style.top = y + 'px';
            room.appendChild(el);

            const dropData = { x: x + parseFloat(dx), y: y + parseFloat(dy), type, amount, el, canPick: false };
            drops.push(dropData);

            setTimeout(() => {
                dropData.canPick = true;
                el.classList.remove('disabled');
            }, 500); // 0.5초 후 획득 가능
        }

        // 모든 적 처치 시 보상 (25% 확률)
        function checkRoomClearReward() {
            if (initialEnemyCount > 0 && enemies.length === 0) {
                initialEnemyCount = 0; // 보상 중복 방지
                if (Math.random() < 0.25) { // 25% 확률
                    const rand = Math.random();
                    const centerX = 152, centerY = 152;
                    if (rand < 0.5) { // 코인 1~5개 흩뿌리기
                        const count = Math.floor(Math.random() * 5) + 1;
                        for (let i = 0; i < count; i++) spawnDrop('coin', 1, centerX, centerY);
                    } else if (rand < 0.8) { // 열쇠 1개
                        spawnDrop('key', 1, centerX, centerY);
                    } else { // 상충 1개
                        spawnChest(Math.random() < 0.3);
                    }
                }
            }
        }

        function updateUI() {
            hpBar.style.width = Math.max(0, (currentHp / maxHp) * 100) + '%';
            coinTxt.innerText = String(coins).padStart(3, '0');
            keyTxt.innerText = String(keys).padStart(3, '0');
        }

        // 조이스틱
        function handlePointer(e) {
            const rect = base.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            let dx = e.clientX - cx;
            let dy = e.clientY - cy;
            const maxR = rect.width / 2;
            const dist = Math.hypot(dx, dy);

            if (dist > maxR) {
                dx = (dx / dist) * maxR;
                dy = (dy / dist) * maxR;
            }

            stick.style.transform = `translate(${dx}px, ${dy}px)`;
            moveX = dx / maxR;
            moveY = dy / maxR;

            if (Math.abs(moveX) > 0.1 || Math.abs(moveY) > 0.1) {
                playerAngle = Math.atan2(dy, dx) * (180 / Math.PI);
            }
        }

        base.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            joystickPointerId = e.pointerId;
            base.setPointerCapture(e.pointerId);
            handlePointer(e);
        });

        base.addEventListener('pointermove', (e) => {
            if (e.pointerId === joystickPointerId) handlePointer(e);
        });

        const releaseJoystick = (e) => {
            if (e.pointerId === joystickPointerId) {
                joystickPointerId = null;
                stick.style.transform = 'translate(0px, 0px)';
                moveX = 0; moveY = 0;
            }
        };

        base.addEventListener('pointerup', releaseJoystick);
        base.addEventListener('pointercancel', releaseJoystick);

        // 공격 및 선 잔상 대시
        attackBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();

            // 칼 베기 애니메이션 및 베기 궤적 반달 이펙트
            daggerPivot.classList.remove('slash');
            void daggerPivot.offsetWidth;
            daggerPivot.classList.add('slash');

            const arc = document.createElement('div');
            arc.className = 'slash-arc';
            daggerPivot.appendChild(arc);
            setTimeout(() => arc.remove(), 150);

            if (lockedEnemy) {
                const oldX = playerX;
                const oldY = playerY;

                const angleRad = Math.atan2(lockedEnemy.y - playerY, lockedEnemy.x - playerX);
                playerX = lockedEnemy.x - Math.cos(angleRad) * 12;
                playerY = lockedEnemy.y - Math.sin(angleRad) * 12;
                playerAngle = angleRad * (180 / Math.PI);

                // 선 잔상 생성
                createDashTrail(oldX, oldY, playerX, playerY);

                // 타격 적용
                const { damage, isCrit } = calcDamage(10);
                lockedEnemy.hp -= damage;
                lockedEnemy.hpFill.style.width = Math.max(0, (lockedEnemy.hp / lockedEnemy.maxHp) * 100) + '%';
                
                showDmgText(lockedEnemy.x, lockedEnemy.y, damage, isCrit);
                triggerShake(isCrit ? 9 : 5);

                if (lockedEnemy.hp <= 0) {
                    spawnDeathParticles(lockedEnemy.x, lockedEnemy.y);
                    lockedEnemy.el.remove();
                    enemies = enemies.filter(en => en !== lockedEnemy);
                    lockedEnemy = null;
                    checkRoomClearReward(); // 방 클리어 체크
                }
            }
        });

        // 메인 프레임 루프
        function gameLoop() {
            const speed = 2.2;
            let nextX = playerX + moveX * speed;
            let nextY = playerY + moveY * speed;

            let canMoveX = true, canMoveY = true;
            for (let w of walls) {
                if (nextX < w.x + w.w && nextX + 12 > w.x && playerY < w.y + w.h && playerY + 12 > w.y) canMoveX = false;
                if (playerX < w.x + w.w && playerX + 12 > w.x && nextY < w.y + w.h && nextY + 12 > w.y) canMoveY = false;
            }

            if (canMoveX) playerX = nextX;
            if (canMoveY) playerY = nextY;

            // 걸을 때 발밑 먼지 이펙트
            if (Math.abs(moveX) > 0.1 || Math.abs(moveY) > 0.1) {
                dustTimer++;
                if (dustTimer % 8 === 0) spawnDust(playerX, playerY);
            }

            // 문 이동
            if (playerX < 6) { if (playerY > 138 && playerY < 170) loadRoom('left'); else playerX = 6; }
            else if (playerX > 302) { if (playerY > 138 && playerY < 170) loadRoom('right'); else playerX = 302; }

            if (playerY < 6) { if (playerX > 138 && playerX < 170) loadRoom('top'); else playerY = 6; }
            else if (playerY > 302) { if (playerX > 138 && playerX < 170) loadRoom('bottom'); else playerY = 302; }

            player.style.left = playerX + 'px';
            player.style.top = playerY + 'px';
            player.style.transform = `rotate(${playerAngle}deg)`;

            // 가장 가까운 적 락온
            let minDist = Infinity;
            lockedEnemy = null;
            enemies.forEach(en => {
                const dist = Math.hypot(en.x - playerX, en.y - playerY);
                if (dist < minDist) {
                    minDist = dist;
                    lockedEnemy = en;
                }
            });

            if (lockedEnemy) {
                targetMarker.style.display = 'block';
                targetMarker.style.left = (lockedEnemy.x - 3) + 'px';
                targetMarker.style.top = (lockedEnemy.y - 3) + 'px';
            } else {
                targetMarker.style.display = 'none';
            }

            // 적 동작 (초당 1발 발사)
            const now = Date.now();
            enemies.forEach(en => {
                if (now - en.lastShoot >= 1000) {
                    en.lastShoot = now;
                    const pAngle = Math.atan2(playerY - en.y, playerX - en.x);
                    const pEl = document.createElement('div');
                    pEl.className = 'projectile';
                    pEl.style.left = en.x + 'px'; pEl.style.top = en.y + 'px';
                    room.appendChild(pEl);
                    projectiles.push({ x: en.x, y: en.y, vx: Math.cos(pAngle) * 2.5, vy: Math.sin(pAngle) * 2.5, el: pEl });
                }
            });

            // 투사체 이동
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.x += p.vx; p.y += p.vy;
                p.el.style.left = p.x + 'px'; p.el.style.top = p.y + 'px';

                let hitWall = false;
                for (let w of walls) {
                    if (p.x > w.x && p.x < w.x + w.w && p.y > w.y && p.y < w.y + w.h) hitWall = true;
                }

                if (Math.hypot(p.x - playerX, p.y - playerY) < 8) {
                    const { damage, isCrit } = calcDamage(5);
                    currentHp -= damage;
                    updateUI();
                    triggerRedVignette();
                    triggerShake(8);
                    showDmgText(playerX, playerY, damage, isCrit, true);

                    p.el.remove();
                    projectiles.splice(i, 1);
                } else if (hitWall || p.x < 0 || p.x > 320 || p.y < 0 || p.y > 320) {
                    p.el.remove();
                    projectiles.splice(i, 1);
                }
            }

            // 상자 오픈
            for (let i = chests.length - 1; i >= 0; i--) {
                if (Math.hypot(chests[i].x - playerX, chests[i].y - playerY) < 14) openChest(chests[i], i);
            }

            // 아이템 습득 (canPick이 true일 때만)
            for (let i = drops.length - 1; i >= 0; i--) {
                const d = drops[i];
                if (d.canPick && Math.hypot(d.x - playerX, d.y - playerY) < 14) {
                    if (d.type === 'coin') coins += d.amount;
                    else if (d.type === 'key') keys += d.amount;
                    else if (d.type === 'potion') currentHp = Math.min(maxHp, currentHp + 25);
                    updateUI();
                    d.el.remove();
                    drops.splice(i, 1);
                }
            }

            requestAnimationFrame(gameLoop);
        }

        updateUI();
        loadRoom('center');
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
