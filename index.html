<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Square Isaac Rogue - Sword & Neon</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; }
        body { background: #050508; color: #fff; font-family: 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        
        /* 600x600 정사각형 게임 컨테이너 */
        #gameContainer { 
            position: relative; 
            width: 600px; 
            height: 600px; 
            background: #0d0d12; 
            border: 4px solid #1f1f2e; 
            border-radius: 20px; 
            box-shadow: 0 0 35px rgba(0, 255, 200, 0.15); 
            overflow: hidden; 
        }
        canvas { display: block; width: 100%; height: 100%; border-radius: 16px; }

        /* UI overlay (Top) */
        #hud { 
            position: absolute; 
            top: 15px; 
            left: 50%; 
            transform: translateX(-50%); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 6px; 
            pointer-events: none; 
            z-index: 10; 
        }

        /* 체력바 */
        .hp-bar-bg { width: 220px; height: 16px; background: rgba(20, 20, 30, 0.8); border: 2px solid #ff3366; border-radius: 10px; overflow: hidden; box-shadow: 0 0 10px rgba(ff, 51, 102, 0.4); }
        .hp-bar-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #ff0055, #ff5500); transition: width 0.15s ease-out; }

        /* 코인 / 열쇠 아이콘 */
        .status-row { display: flex; gap: 20px; font-weight: bold; font-size: 15px; text-shadow: 0 0 8px rgba(255,255,255,0.6); }
        .status-item { display: flex; align-items: center; gap: 4px; background: rgba(0,0,0,0.6); padding: 3px 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }

        /* 조이스틱 및 버튼 조작계 */
        #controls { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            width: 600px; 
            max-width: 100%; 
            padding: 15px 20px; 
        }
        .touch-zone { width: 100px; height: 100px; background: rgba(255,255,255,0.05); border: 2px dashed rgba(255,255,255,0.2); border-radius: 50%; position: relative; }
        .knob { width: 40px; height: 40px; background: rgba(0, 255, 200, 0.5); border-radius: 50%; position: absolute; top: 28px; left: 28px; pointer-events: none; box-shadow: 0 0 12px #00ffc8; }
        
        .btn-group { display: flex; gap: 12px; }
        .action-btn { width: 65px; height: 65px; border-radius: 50%; border: none; font-weight: bold; font-size: 14px; color: #fff; cursor: pointer; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        .btn-attack { background: linear-gradient(135deg, #00ffc8, #0088ff); box-shadow: 0 0 15px rgba(0, 255, 200, 0.4); }
        .btn-bomb { background: linear-gradient(135deg, #ff0055, #ff5500); box-shadow: 0 0 15px rgba(255, 0, 85, 0.4); }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="hud">
        <div class="hp-bar-bg"><div id="hpFill" class="hp-bar-fill"></div></div>
        <div class="status-row">
            <div class="status-item">🪙 <span id="coinText">000</span></div>
            <div class="status-item">🔑 <span id="keyText">000</span></div>
        </div>
    </div>
    <canvas id="gameCanvas" width="600" height="600"></canvas>
</div>

<div id="controls">
    <div id="moveZone" class="touch-zone"><div id="moveKnob" class="knob"></div></div>
    <div class="btn-group">
        <button id="bombBtn" class="action-btn btn-bomb">BOMB</button>
        <button id="attackBtn" class="action-btn btn-attack">ATTACK</button>
    </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// --- GAME STATE ---
const state = {
    coins: 0,
    keys: 0,
    player: {
        x: 300, y: 300, r: 10, // 캐릭터 축소
        hp: 100, maxHp: 100,
        speed: 3.2,
        angle: 0,
        invulnerable: 0,
        isAttacking: false,
        attackAngle: 0,
        attackProgress: 0
    },
    currentRoom: { x: 0, y: 0 },
    visitedRooms: {},
    enemies: [],
    bombs: [],
    particles: [],
    keysPressed: {},
    moveDir: { x: 0, y: 0 }
};

// --- MAP GENERATOR (5 VARIANTS) ---
function getRoomData(rx, ry) {
    const key = `${rx},${ry}`;
    if (!state.visitedRooms[key]) {
        const variant = Math.floor(Math.abs(Math.sin(rx * 12.9898 + ry * 78.233)) * 5); // Random layout 0~4
        state.visitedRooms[key] = { variant, cleared: false };
    }
    return state.visitedRooms[key];
}

function loadRoom(rx, ry) {
    state.currentRoom = { x: rx, y: ry };
    const roomData = getRoomData(rx, ry);
    
    // Spawn Enemies
    state.enemies = [];
    if (!roomData.cleared) {
        const count = 3 + (Math.abs(rx) + Math.abs(ry)) % 4;
        for (let i = 0; i < count; i++) {
            const isFly = Math.random() > 0.4;
            state.enemies.push({
                x: 100 + Math.random() * 400,
                y: 100 + Math.random() * 400,
                r: isFly ? 8 : 11,
                hp: isFly ? 15 : 30,
                maxHp: isFly ? 15 : 30,
                speed: isFly ? 1.8 : 1.2,
                type: isFly ? 'fly' : 'chaser'
            });
        }
    }
}

// --- INPUTS & TOUCH JOYSTICK ---
window.addEventListener("keydown", e => {
    state.keysPressed[e.key.toLowerCase()] = true;
    if (e.key === " " || e.key.toLowerCase() === "j") triggerAttack();
    if (e.key === "Shift" || e.key.toLowerCase() === "e") plantBomb();
});
window.addEventListener("keyup", e => state.keysPressed[e.key.toLowerCase()] = false);

function setupJoystick() {
    const zone = document.getElementById("moveZone");
    const knob = document.getElementById("moveKnob");
    let touchId = null, base = { x: 0, y: 0 };

    zone.addEventListener("touchstart", e => {
        const t = e.changedTouches[0];
        touchId = t.identifier;
        const rect = zone.getBoundingClientRect();
        base = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
        update(t);
    });

    zone.addEventListener("touchmove", e => {
        for (let t of e.changedTouches) if (t.identifier === touchId) update(t);
    });

    const reset = e => {
        for (let t of e.changedTouches) if (t.identifier === touchId) {
            touchId = null;
            knob.style.transform = `translate(0px, 0px)`;
            state.moveDir = { x: 0, y: 0 };
        }
    };
    zone.addEventListener("touchend", reset);
    zone.addEventListener("touchcancel", reset);

    function update(t) {
        let dx = t.clientX - base.x, dy = t.clientY - base.y;
        let dist = Math.hypot(dx, dy), max = 30;
        if (dist > max) { dx = (dx / dist) * max; dy = (dy / dist) * max; }
        knob.style.transform = `translate(${dx}px, ${dy}px)`;
        state.moveDir = { x: dx / max, y: dy / max };
    }
}
setupJoystick();

document.getElementById("attackBtn").addEventListener("click", triggerAttack);
document.getElementById("bombBtn").addEventListener("click", plantBomb);

// --- COMBAT ACTIONS ---
function triggerAttack() {
    if (state.player.isAttacking) return;
    state.player.isAttacking = true;
    state.player.attackProgress = 0;
    
    // 공격 방향 설정
    if (state.moveDir.x !== 0 || state.moveDir.y !== 0) {
        state.player.attackAngle = Math.atan2(state.moveDir.y, state.moveDir.x);
    } else {
        state.player.attackAngle = state.player.angle;
    }
}

function plantBomb() {
    state.bombs.push({
        x: state.player.x,
        y: state.player.y,
        timer: 90, // 1.5 seconds
        r: 8
    });
}

// --- UPDATE LOOP ---
function update() {
    const p = state.player;

    // 1. Movement
    let mx = state.moveDir.x, my = state.moveDir.y;
    if (state.keysPressed['a']) mx = -1; if (state.keysPressed['d']) mx = 1;
    if (state.keysPressed['w']) my = -1; if (state.keysPressed['s']) my = 1;

    let len = Math.hypot(mx, my);
    if (len > 0) {
        p.x += (mx / (len > 1 ? len : 1)) * p.speed;
        p.y += (my / (len > 1 ? len : 1)) * p.speed;
        p.angle = Math.atan2(my, mx);
    }

    // 2. Room Collision & Door Transitions (무한 방 이동)
    const doorSize = 36;
    // North Door
    if (p.y <= 25 && Math.abs(p.x - 300) < doorSize/2) { loadRoom(state.currentRoom.x, state.currentRoom.y - 1); p.y = 560; }
    // South Door
    else if (p.y >= 575 && Math.abs(p.x - 300) < doorSize/2) { loadRoom(state.currentRoom.x, state.currentRoom.y + 1); p.y = 40; }
    // West Door
    else if (p.x <= 25 && Math.abs(p.y - 300) < doorSize/2) { loadRoom(state.currentRoom.x - 1, state.currentRoom.y); p.x = 560; }
    // East Door
    else if (p.x >= 575 && Math.abs(p.y - 300) < doorSize/2) { loadRoom(state.currentRoom.x + 1, state.currentRoom.y); p.x = 40; }

    // Clamp inside Walls
    p.x = Math.max(25, Math.min(575, p.x));
    p.y = Math.max(25, Math.min(575, p.y));

    // 3. Sword Swing Logic
    if (p.isAttacking) {
        p.attackProgress += 0.15;
        const currentArc = p.attackAngle - Math.PI/3 + (p.attackProgress * Math.PI * 0.66);
        
        // 칼 히트박스 판정
        state.enemies.forEach(e => {
            const swordX = p.x + Math.cos(currentArc) * 28;
            const swordY = p.y + Math.sin(currentArc) * 28;
            if (Math.hypot(swordX - e.x, swordY - e.y) < e.r + 15) {
                e.hp -= 2.5;
                // Knockback
                e.x += Math.cos(currentArc) * 6;
                e.y += Math.sin(currentArc) * 6;
            }
        });

        if (p.attackProgress >= 1) p.isAttacking = false;
    }

    // 4. Enemy AI & Damage
    state.enemies.forEach(e => {
        let dx = p.x - e.x, dy = p.y - e.y;
        let dist = Math.hypot(dx, dy);
        if (dist > 0) {
            e.x += (dx / dist) * e.speed;
            e.y += (dy / dist) * e.speed;
        }

        if (dist < p.r + e.r && p.invulnerable <= 0) {
            p.hp = Math.max(0, p.hp - 10);
            p.invulnerable = 30; // 무적 시간
            if (p.hp <= 0) {
                alert("Game Over! 새로 시작합니다.");
                p.hp = 100;
                state.coins = 0; state.keys = 0;
                loadRoom(0,0);
            }
        }
    });

    state.enemies = state.enemies.filter(e => {
        if (e.hp <= 0) {
            state.coins += Math.floor(Math.random() * 2) + 1;
            return false;
        }
        return true;
    });

    // 5. Bomb Logic
    state.bombs.forEach(b => {
        b.timer--;
        if (b.timer <= 0) {
            // 폭발 효과 및 데미지
            state.enemies.forEach(e => {
                if (Math.hypot(b.x - e.x, b.y - e.y) < 90) e.hp -= 50;
            });
            if (Math.hypot(b.x - p.x, b.y - p.y) < 90 && p.invulnerable <= 0) {
                p.hp -= 20; p.invulnerable = 30;
            }
            // 파티클 생성
            for(let i=0; i<20; i++) {
                state.particles.push({
                    x: b.x, y: b.y,
                    vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8,
                    life: 20, color: "#ff5500"
                });
            }
        }
    });
    state.bombs = state.bombs.filter(b => b.timer > 0);

    // Particles
    state.particles.forEach(pt => { pt.x += pt.vx; pt.y += pt.vy; pt.life--; });
    state.particles = state.particles.filter(pt => pt.life > 0);

    if (p.invulnerable > 0) p.invulnerable--;

    // UI Update
    document.getElementById("hpFill").style.width = `${(p.hp / p.maxHp) * 100}%`;
    document.getElementById("coinText").innerText = String(state.coins).padStart(3, '0');
    document.getElementById("keyText").innerText = String(state.keys).padStart(3, '0');
}

// --- RENDER ENGINE (NEON GLOW) ---
function draw() {
    ctx.clearRect(0, 0, 600, 600);

    // 1. Dark Room Floor
    ctx.fillStyle = "#0c0c14";
    ctx.fillRect(0, 0, 600, 600);

    // 2. Obstacles (5 Room Layout Variants)
    const room = getRoomData(state.currentRoom.x, state.currentRoom.y);
    ctx.fillStyle = "#181828";
    ctx.strokeStyle = "#00ffc8";
    ctx.lineWidth = 2;
    ctx.shadowBlur = 8;
    ctx.shadowColor = "#00ffc8";

    if (room.variant === 1) { // 4 Pillars
        [150, 450].forEach(x => [150, 450].forEach(y => {
            ctx.fillRect(x-20, y-20, 40, 40); ctx.strokeRect(x-20, y-20, 40, 40);
        }));
    } else if (room.variant === 2) { // Center Block
        ctx.fillRect(240, 240, 120, 120); ctx.strokeRect(240, 240, 120, 120);
    } else if (room.variant === 3) { // Cross
        ctx.fillRect(280, 120, 40, 360); ctx.fillRect(120, 280, 360, 40);
    } else if (room.variant === 4) { // Corner Blocks
        [[80,80], [480,80], [80,480], [480,480]].forEach(([x,y]) => {
            ctx.fillRect(x-20, y-20, 40, 40); ctx.strokeRect(x-20, y-20, 40, 40);
        });
    }

    // 3. Walls & Doors
    ctx.strokeStyle = "#ff0055";
    ctx.shadowColor = "#ff0055";
    ctx.shadowBlur = 12;
    ctx.lineWidth = 6;
    ctx.strokeRect(10, 10, 580, 580);

    // 4 Doors (상하좌우 꼭 존재)
    ctx.fillStyle = "#00ffc8";
    ctx.shadowColor = "#00ffc8";
    ctx.shadowBlur = 15;
    ctx.fillRect(282, 4, 36, 12);  // North Door
    ctx.fillRect(282, 584, 36, 12); // South Door
    ctx.fillRect(4, 282, 12, 36);  // West Door
    ctx.fillRect(584, 282, 12, 36); // East Door

    // 4. Bombs
    state.bombs.forEach(b => {
        ctx.fillStyle = "#ff5500";
        ctx.shadowColor = "#ff5500";
        ctx.shadowBlur = 15;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r + (b.timer % 10 > 5 ? 2 : 0), 0, Math.PI*2); ctx.fill();
    });

    // 5. Enemies
    state.enemies.forEach(e => {
        ctx.fillStyle = e.type === 'fly' ? "#ff0055" : "#ffaa00";
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI*2); ctx.fill();
    });

    // 6. Player
    const p = state.player;
    if (p.invulnerable % 4 < 2) {
        ctx.fillStyle = "#00ffc8";
        ctx.shadowColor = "#00ffc8";
        ctx.shadowBlur = 15;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();

        // Sword Model & Swing Animation
        ctx.save();
        ctx.translate(p.x, p.y);
        if (p.isAttacking) {
            const currentArc = p.attackAngle - Math.PI/3 + (p.attackProgress * Math.PI * 0.66);
            ctx.rotate(currentArc);
        } else {
            ctx.rotate(p.angle);
        }

        // Sword Visual (Neon Blade)
        ctx.strokeStyle = "#ffffff";
        ctx.shadowColor = "#00ffc8";
        ctx.shadowBlur = 10;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(8, 0);
        ctx.lineTo(28, 0); // 칼날
        ctx.stroke();

        ctx.restore();
    }

    // Particles
    state.particles.forEach(pt => {
        ctx.fillStyle = pt.color;
        ctx.shadowColor = pt.color;
        ctx.shadowBlur = 8;
        ctx.beginPath(); ctx.arc(pt.x, pt.y, 3, 0, Math.PI*2); ctx.fill();
    });

    ctx.shadowBlur = 0; // Reset
}

// System Init
loadRoom(0, 0);
function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
