<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dark Room Game</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: sans-serif;
            overflow: hidden;
        }

        /* 원래 넓은 정사각형 방 크기 유지 */
        #room {
            width: 320px;
            height: 320px;
            background-color: #2b1d0c;
            background-image: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 16px,
                rgba(0, 0, 0, 0.25) 16px,
                rgba(0, 0, 0, 0.25) 32px
            );
            border: 4px solid #1a1007;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.9);
        }

        /* 연한 갈색 문 */
        .door {
            position: absolute;
            background-color: #b08d57;
            border: 1px solid #7a5e37;
        }

        .door-top { top: 0; left: 50%; transform: translateX(-50%); width: 44px; height: 8px; border-top: none; border-radius: 0 0 4px 4px; }
        .door-bottom { bottom: 0; left: 50%; transform: translateX(-50%); width: 44px; height: 8px; border-bottom: none; border-radius: 4px 4px 0 0; }
        .door-left { top: 50%; left: 0; transform: translateY(-50%); width: 8px; height: 44px; border-left: none; border-radius: 0 4px 4px 0; }
        .door-right { top: 50%; right: 0; transform: translateY(-50%); width: 8px; height: 44px; border-right: none; border-radius: 4px 0 0 4px; }

        /* 캐릭터 (더 작아짐, 14px) */
        #player {
            width: 14px;
            height: 14px;
            background-color: #6366f1;
            border: 1px solid #818cf8;
            border-radius: 4px;
            position: absolute;
            top: 153px;
            left: 153px;
            box-shadow: 0 0 5px rgba(99, 102, 241, 0.6);
            /* 회전 중심축 설정 */
            transform-origin: center center;
        }

        /* 시선 방향을 나타내는 눈점 */
        #player::after {
            content: '';
            position: absolute;
            right: 2px;
            top: 3px;
            width: 3px;
            height: 3px;
            background-color: #ffffff;
            border-radius: 50%;
        }

        /* 단검 피벗 (회전축) */
        #dagger-pivot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            transform-origin: 0 0;
        }

        /* 자연스럽게 쥔 단검 */
        .dagger {
            position: absolute;
            top: -2px;
            left: 4px;
            width: 9px;
            height: 2px;
            background-color: #e2e8f0;
            border-radius: 0 2px 2px 0;
            box-shadow: 0 0 3px rgba(255, 255, 255, 0.9);
        }

        /* 단검 가드 및 자루 */
        .dagger::before {
            content: '';
            position: absolute;
            left: -2px;
            top: -1px;
            width: 2px;
            height: 4px;
            background-color: #475569;
        }

        /* 휘두르기 애니메이션 */
        .slash {
            animation: slash-anim 0.15s ease-out;
        }

        @keyframes slash-anim {
            0% { transform: rotate(-50deg); }
            50% { transform: rotate(70deg); }
            100% { transform: rotate(0deg); }
        }

        /* 방 외부 컨트롤러 영역 */
        #controls-container {
            width: 320px;
            height: 100px;
            margin-top: 20px;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 소형 조이스틱 & 버튼 */
        #joystick-base {
            width: 80px;
            height: 80px;
            background-color: #262626;
            border: 2px solid #404040;
            border-radius: 50%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #joystick-stick {
            width: 30px;
            height: 30px;
            background-color: #525252;
            border-radius: 50%;
            position: absolute;
        }

        #attack-btn {
            width: 60px;
            height: 60px;
            background-color: #991b1b;
            color: #fca5a5;
            border: 2px solid #dc2626;
            border-radius: 50%;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 5px rgba(0,0,0,0.4);
        }

        #attack-btn:active {
            background-color: #7f1d1d;
        }
    </style>
</head>
<body>

    <div id="room">
        <div class="door door-top"></div>
        <div class="door door-bottom"></div>
        <div class="door door-left"></div>
        <div class="door door-right"></div>
        
        <div id="player">
            <div id="dagger-pivot">
                <div class="dagger"></div>
            </div>
        </div>
    </div>

    <div id="controls-container">
        <div id="joystick-base">
            <div id="joystick-stick"></div>
        </div>

        <button id="attack-btn">공격</button>
    </div>

    <script>
        const player = document.getElementById('player');
        const daggerPivot = document.getElementById('dagger-pivot');
        const base = document.getElementById('joystick-base');
        const stick = document.getElementById('joystick-stick');
        const attackBtn = document.getElementById('attack-btn');

        let playerX = 153;
        let playerY = 153;
        let moveX = 0;
        let moveY = 0;
        let playerAngle = 0; // 바라보는 각도 (도 단위)

        let joystickPointerId = null;

        // 조이스틱 조작
        base.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            joystickPointerId = e.pointerId;
            base.setPointerCapture(e.pointerId);
            updateJoystick(e);
        });

        base.addEventListener('pointermove', (e) => {
            if (e.pointerId === joystickPointerId) {
                updateJoystick(e);
            }
        });

        const resetJoystick = (e) => {
            if (e.pointerId === joystickPointerId) {
                joystickPointerId = null;
                stick.style.transform = 'translate(0px, 0px)';
                moveX = 0;
                moveY = 0;
            }
        };

        base.addEventListener('pointerup', resetJoystick);
        base.addEventListener('pointercancel', resetJoystick);

        function updateJoystick(e) {
            const rect = base.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            let deltaX = e.clientX - centerX;
            let deltaY = e.clientY - centerY;

            const maxRadius = rect.width / 2;
            const distance = Math.hypot(deltaX, deltaY);

            if (distance > maxRadius) {
                deltaX = (deltaX / distance) * maxRadius;
                deltaY = (deltaY / distance) * maxRadius;
            }

            stick.style.transform = `translate(${deltaX}px, ${deltaY}px)`;

            moveX = deltaX / maxRadius;
            moveY = deltaY / maxRadius;

            // 이동 방향 각도 계산 (조이스틱을 당긴 방향으로 회전)
            if (Math.abs(moveX) > 0.1 || Math.abs(moveY) > 0.1) {
                playerAngle = Math.atan2(deltaY, deltaX) * (180 / Math.PI);
            }
        }

        // 공격 동작
        attackBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            
            daggerPivot.classList.remove('slash');
            void daggerPivot.offsetWidth;
            daggerPivot.classList.add('slash');
        });

        // 메인 프레임 루프
        function gameLoop() {
            const speed = 2.2;
            playerX += moveX * speed;
            playerY += moveY * speed;

            // 방 영역 내 이동 제한 (방 크기 320px - 캐릭터 14px)
            playerX = Math.max(4, Math.min(302, playerX));
            playerY = Math.max(4, Math.min(302, playerY));

            player.style.left = playerX + 'px';
            player.style.top = playerY + 'px';
            
            // 바라보는 방향으로 캐릭터 회전 적용
            player.style.transform = `rotate(${playerAngle}deg)`;

            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
