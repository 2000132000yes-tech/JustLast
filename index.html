<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dark Room Game</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: sans-serif;
            overflow: hidden;
        }

        /* 낡은 나무 장판 바닥의 어두운 방 */
        #room {
            width: 240px;
            height: 240px;
            background-color: #2b1d0c;
            /* 은은하고 자연스러운 나무 결 패턴 */
            background-image: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 12px,
                rgba(0, 0, 0, 0.25) 12px,
                rgba(0, 0, 0, 0.25) 24px
            );
            border: 3px solid #1a1007;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0,0,0,0.9);
        }

        /* 연한 갈색의 축소된 문 */
        .door {
            position: absolute;
            background-color: #b08d57;
            border: 1px solid #7a5e37;
        }

        .door-top { top: 0; left: 50%; transform: translateX(-50%); width: 36px; height: 6px; border-top: none; border-radius: 0 0 3px 3px; }
        .door-bottom { bottom: 0; left: 50%; transform: translateX(-50%); width: 36px; height: 6px; border-bottom: none; border-radius: 3px 3px 0 0; }
        .door-left { top: 50%; left: 0; transform: translateY(-50%); width: 6px; height: 36px; border-left: none; border-radius: 0 3px 3px 0; }
        .door-right { top: 50%; right: 0; transform: translateY(-50%); width: 6px; height: 36px; border-right: none; border-radius: 3px 0 0 3px; }

        /* 소형 플레이어 */
        #player {
            width: 18px;
            height: 18px;
            background-color: #6366f1;
            border: 1px solid #818cf8;
            border-radius: 5px;
            position: absolute;
            top: 111px;
            left: 111px;
            box-shadow: 0 0 6px rgba(99, 102, 241, 0.5);
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        /* 단검 회전 앵커 */
        #dagger-pivot {
            position: absolute;
            right: -10px;
            top: 50%;
            width: 0px;
            height: 0px;
            transform-origin: 0% 0%;
            transform: rotate(0deg);
        }

        /* 단검 모델링 */
        .dagger {
            position: absolute;
            top: -2px;
            left: 0;
            width: 10px;
            height: 3px;
            background-color: #e2e8f0;
            border-radius: 0 2px 2px 0;
            box-shadow: 0 0 2px rgba(255, 255, 255, 0.8);
        }

        /* 손잡이 */
        .dagger::before {
            content: '';
            position: absolute;
            left: -4px;
            top: -1px;
            width: 4px;
            height: 5px;
            background-color: #475569;
            border-radius: 1px;
        }

        /* 단검 휘두르기 애니메이션 클래스 */
        .slash {
            animation: slash-anim 0.15s ease-out;
        }

        @keyframes slash-anim {
            0% { transform: rotate(-45deg); }
            50% { transform: rotate(90deg); }
            100% { transform: rotate(0deg); }
        }

        /* 컨트롤러 영역 */
        #controls-container {
            width: 240px;
            height: 100px;
            margin-top: 20px;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 소형 조이스틱 */
        #joystick-base {
            width: 80px;
            height: 80px;
            background-color: #262626;
            border: 2px solid #404040;
            border-radius: 50%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #joystick-stick {
            width: 30px;
            height: 30px;
            background-color: #525252;
            border-radius: 50%;
            position: absolute;
        }

        /* 소형 공격 버튼 */
        #attack-btn {
            width: 60px;
            height: 60px;
            background-color: #991b1b;
            color: #fca5a5;
            border: 2px solid #dc2626;
            border-radius: 50%;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 5px rgba(0,0,0,0.4);
        }

        #attack-btn:active {
            background-color: #7f1d1d;
        }
    </style>
</head>
<body>

    <!-- 방 & 플레이어 -->
    <div id="room">
        <div class="door door-top"></div>
        <div class="door door-bottom"></div>
        <div class="door door-left"></div>
        <div class="door door-right"></div>
        
        <div id="player">
            <div id="dagger-pivot">
                <div class="dagger"></div>
            </div>
        </div>
    </div>

    <!-- 외부 컨트롤러 -->
    <div id="controls-container">
        <div id="joystick-base">
            <div id="joystick-stick"></div>
        </div>

        <button id="attack-btn">공격</button>
    </div>

    <script>
        const player = document.getElementById('player');
        const daggerPivot = document.getElementById('dagger-pivot');
        const base = document.getElementById('joystick-base');
        const stick = document.getElementById('joystick-stick');
        const attackBtn = document.getElementById('attack-btn');

        let playerX = 111;
        let playerY = 111;
        let moveX = 0;
        let moveY = 0;

        let joystickPointerId = null;

        // --- 조이스틱 로직 (독립적 입력 처리) ---
        base.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            joystickPointerId = e.pointerId;
            base.setPointerCapture(e.pointerId);
            updateJoystick(e);
        });

        base.addEventListener('pointermove', (e) => {
            if (e.pointerId === joystickPointerId) {
                updateJoystick(e);
            }
        });

        const resetJoystick = (e) => {
            if (e.pointerId === joystickPointerId) {
                joystickPointerId = null;
                stick.style.transform = 'translate(0px, 0px)';
                moveX = 0;
                moveY = 0;
            }
        };

        base.addEventListener('pointerup', resetJoystick);
        base.addEventListener('pointercancel', resetJoystick);

        function updateJoystick(e) {
            const rect = base.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            let deltaX = e.clientX - centerX;
            let deltaY = e.clientY - centerY;

            const maxRadius = rect.width / 2;
            const distance = Math.hypot(deltaX, deltaY);

            if (distance > maxRadius) {
                deltaX = (deltaX / distance) * maxRadius;
                deltaY = (deltaY / distance) * maxRadius;
            }

            stick.style.transform = `translate(${deltaX}px, ${deltaY}px)`;

            moveX = deltaX / maxRadius;
            moveY = deltaY / maxRadius;
        }

        // --- 공격 버튼 로직 (조이스틱과 독립적 작동) ---
        attackBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            
            // 단검 휘두르기 애니메이션 트리거
            daggerPivot.classList.remove('slash');
            void daggerPivot.offsetWidth; // Reflow 발생으로 애니메이션 리셋
            daggerPivot.classList.add('slash');
        });

        // --- 루프 (이동 업데이트) ---
        function gameLoop() {
            const speed = 2.5;
            playerX += moveX * speed;
            playerY += moveY * speed;

            // 방 영역 제한 (240px - 플레이어 18px)
            playerX = Math.max(3, Math.min(219, playerX));
            playerY = Math.max(3, Math.min(219, playerY));

            player.style.left = playerX + 'px';
            player.style.top = playerY + 'px';

            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
